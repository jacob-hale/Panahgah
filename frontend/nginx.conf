server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Production: keep browser requests same-origin by proxying API calls.
    # This avoids CORS/cookie issues when the backend is on a different domain.
    location /api/ {
        proxy_pass https://panahgah-backend-production.up.railway.app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}