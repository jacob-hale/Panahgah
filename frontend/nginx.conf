map $http_x_forwarded_proto $upstream_forwarded_proto {
    ''      https;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Railway (and similar PaaS) terminates TLS at the edge and forwards requests to this container.
    # Enforce HTTPS based on the forwarded scheme so plain-HTTP public requests are redirected.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Security headers (evaluated in browser devtools on page responses).
    # connect-src: same-origin (/api proxied), direct backend when client uses VITE_API_BASE_URL / Railway fallback, and Chatbase.
    # script-src / frame-src: Chatbase embed (SPA is served by nginx, not only the API).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' https://www.chatbase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src 'self' https://www.facebook.com https://www.instagram.com https://www.chatbase.co https://*.chatbase.co; connect-src 'self' https://panahgah-backend-production.up.railway.app https://www.chatbase.co https://*.chatbase.co wss://*.chatbase.co" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Production: keep browser requests same-origin by proxying API calls.
    # This avoids CORS/cookie issues when the backend is on a different domain.
    location /api/ {
        proxy_pass https://panahgah-backend-production.up.railway.app;
        proxy_http_version 1.1;

        # Proxying to an HTTPS upstream: enable SNI or TLS handshake can fail (502).
        proxy_ssl_server_name on;
        proxy_ssl_name panahgah-backend-production.up.railway.app;

        # Send upstream host as Host header (not the UI host).
        proxy_set_header Host panahgah-backend-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve edge TLS (Railway); default https if the edge header is missing.
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        # So ASP.NET sees the public browser host (links / forwarded request metadata).
        proxy_set_header X-Forwarded-Host $host;
    }

    # Social/Meta crawlers must get real image bytes — never fall back to index.html for missing PNGs.
    location /campaign-media/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
